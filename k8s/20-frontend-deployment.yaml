apiVersion: apps/v1
kind: Deployment
metadata:
  name: sem-frontend
  labels:
    app.kubernetes.io/name: sem-frontend
    app.kubernetes.io/part-of: sem
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sem-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sem-frontend
        app.kubernetes.io/part-of: sem
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sem-frontend
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: sem-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE lets non-root bind :80. If you front
              # nginx with a proxy on a high port, drop this too.
              add: ["NET_BIND_SERVICE"]
