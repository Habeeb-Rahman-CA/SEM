apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sem-frontend
  labels:
    app.kubernetes.io/name: sem-frontend
    app.kubernetes.io/part-of: sem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sem-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
