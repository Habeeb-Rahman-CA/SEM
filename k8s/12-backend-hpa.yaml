apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sem-backend
  labels:
    app.kubernetes.io/name: sem-backend
    app.kubernetes.io/part-of: sem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sem-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Uncomment once a metrics adapter (e.g. prometheus-adapter, keda)
    # is installed. Requests-per-second is a better scaling signal than
    # CPU for I/O-bound Node workloads.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
  behavior:
    scaleUp:
      # Reasonably eager on scale-up so a spike doesn't get rate-limited
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Slow on scale-down to avoid flapping between load levels
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
