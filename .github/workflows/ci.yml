name: CI

# Runs on every PR and every push to main. Fast-fail order:
#   1. Format / lint            — trivial, catches style regressions first
#   2. Typecheck                — cheap, catches most breakage
#   3. Unit tests               — moderate cost
#   4. Build (backend + front)  — expensive but proves the artefact
#   5. Docker build smoke test  — proves the Dockerfile still works
#
# Runs backend + frontend jobs in parallel; a failure in one won't cancel
# the other so devs see everything wrong in a single run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same PR (or branch) to save minutes.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sem-backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sem_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: sem-backend/package-lock.json
      - run: npm ci --no-audit --no-fund

      # Fast-fail order — style/lint first, then heavier steps
      - name: Prettier check
        run: npx prettier --check "src/**/*.ts"
      - name: ESLint
        run: npx eslint "src/**/*.ts"
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: sem_ci
          REDIS_HOST: localhost
          JWT_SECRET: ci-secret
        run: npm test -- --passWithNoTests
      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + typecheck + build + budgets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sem-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: sem-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,html,css}"
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: npm test -- --run --passWithNoTests
      - name: Production build (enforces bundle budgets)
        run: npm run build:prod
      - name: Bundle size summary
        run: |
          echo "### Bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist/sem-frontend/browser -maxdepth 1 -name '*.js' -printf '%f %s\n' \
            | sort -k2 -nr \
            | awk '{ printf "%-60s %10.1f KB\n", $1, $2/1024 }' \
            >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ─── Docker build smoke test ─────────────────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sem-backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./sem-frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
