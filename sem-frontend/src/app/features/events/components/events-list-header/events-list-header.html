<div class="flex items-center justify-between border-b border-white/5 pb-4">
  <div>
    <h2 class="text-lg font-bold text-white">Events</h2>
    <p class="text-xs text-slate-500 mt-1">Manage competitions, schedules, and matches</p>
  </div>
  @if (canManage()) {
    <div class="flex items-center gap-2">
      <button
        (click)="openTemplates.emit()"
        id="events-templates-btn"
        class="flex items-center gap-1.5 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-bold rounded-xl border border-white/10 hover:border-white/20 transition-all cursor-pointer"
      >
        <i class="fi fi-rr-template"></i>
        Templates
      </button>
      <button
        (click)="addEvent.emit()"
        id="events-add-event-btn"
        class="flex items-center gap-1.5 px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-violet-900/20 transition-all cursor-pointer"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Add Event
      </button>
    </div>
  }
</div>

<div class="flex items-center gap-2 border-b border-white/5 pb-3">
  <button
    (click)="activeView.set('active')"
    [class]="
      activeView() === 'active'
        ? 'px-4 py-2 bg-violet-600/10 border border-violet-500/20 text-violet-400 text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow-md shadow-violet-900/10'
        : 'px-4 py-2 text-slate-400 hover:text-white border border-transparent hover:bg-white/5 text-xs font-bold rounded-xl transition flex items-center gap-1.5'
    "
  >
    <i class="fi fi-rr-play text-sm"></i> Active Events ({{ activeEventCount() }})
  </button>
  <button
    (click)="activeView.set('archived')"
    [class]="
      activeView() === 'archived'
        ? 'px-4 py-2 bg-violet-600/10 border border-violet-500/20 text-violet-400 text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow-md shadow-violet-900/10'
        : 'px-4 py-2 text-slate-400 hover:text-white border border-transparent hover:bg-white/5 text-xs font-bold rounded-xl transition flex items-center gap-1.5'
    "
  >
    <i class="fi fi-rr-archive text-sm"></i> Archive ({{ archivedEventCount() }})
  </button>
</div>
