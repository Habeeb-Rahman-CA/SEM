@if (isOpen()) {
  <div
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    (click)="close()"
  >
    <div
      class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div
        class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-violet-500 to-indigo-500"
      ></div>

      <div class="px-6 py-5 border-b border-white/5 flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            @if (editingAd()) {
              <span>Edit ad:</span>
              <span class="text-violet-400">{{ editingAd()?.name }}</span>
            } @else {
              <span>New banner advertisement</span>
            }
          </h3>
          <p class="text-xs text-slate-400 mt-1">
            Configure the creative, target URL, placement, schedule, and rotation weight.
          </p>
        </div>
        <button
          type="button"
          (click)="close()"
          class="text-slate-400 hover:text-white transition cursor-pointer bg-transparent border-0"
          aria-label="Close"
        >
          <i class="fi fi-rr-cross-small text-lg"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto flex-1 text-left flex flex-col gap-4">
        @if (error()) {
          <div
            class="rounded-xl bg-rose-500/10 border border-rose-500/30 p-3 text-rose-300 text-xs flex items-center gap-2"
          >
            <i class="fi fi-rr-triangle-warning text-xs"></i>
            {{ error() }}
          </div>
        }

        <!-- Creative + basic fields -->
        <div class="grid grid-cols-1 sm:grid-cols-[180px_1fr] gap-4 items-start">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Creative <span class="text-rose-400">*</span>
            </label>
            <app-photo-capture
              label=""
              hint="wide banner ratio works best"
              uploadType="event"
              shape="thumb"
              buttonLabel="Upload creative"
              [imageUrl]="imageUrl() || null"
              (imageUploaded)="onCreativeUploaded($event)"
              (imageRemoved)="imageUrl.set('')"
            />
          </div>

          <div class="flex flex-col gap-3">
            <div class="flex flex-col gap-1.5">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                Internal name <span class="text-rose-400">*</span>
                <span class="text-slate-600 font-normal normal-case">(never shown publicly)</span>
              </label>
              <input
                type="text"
                placeholder="e.g. Acme Q4 launch"
                [ngModel]="name()"
                (ngModelChange)="name.set($event)"
                class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 outline-none transition-all w-full"
              />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                Alt text / headline
              </label>
              <input
                type="text"
                placeholder="Screen-reader label + on-hover tooltip"
                [ngModel]="title()"
                (ngModelChange)="title.set($event)"
                class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 outline-none transition-all w-full"
              />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                Target URL <span class="text-rose-400">*</span>
              </label>
              <input
                type="url"
                placeholder="https://…"
                [ngModel]="targetUrl()"
                (ngModelChange)="targetUrl.set($event)"
                class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 outline-none transition-all w-full font-mono"
              />
            </div>
          </div>
        </div>

        <!-- Placement -->
        <div class="flex flex-col gap-2 border-t border-white/5 pt-4">
          <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
            Placement <span class="text-rose-400">*</span>
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            @for (p of placements; track p.value) {
              <label
                [class]="
                  'flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition ' +
                  (placement() === p.value
                    ? 'border-violet-500/40 bg-violet-500/5'
                    : 'border-white/10 bg-slate-950/40 hover:border-white/20')
                "
              >
                <input
                  type="radio"
                  name="ad-placement"
                  class="mt-0.5 accent-violet-500"
                  [checked]="placement() === p.value"
                  (change)="placement.set(p.value)"
                />
                <div>
                  <div class="text-xs font-bold text-white">{{ p.label }}</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">{{ p.hint }}</div>
                </div>
              </label>
            }
          </div>
        </div>

        <!-- Scope: event + sponsor -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Event scope
              <span class="text-slate-600 font-normal normal-case">
                (leave blank for workspace-wide)
              </span>
            </label>
            <select
              [ngModel]="eventId()"
              (ngModelChange)="eventId.set($event)"
              class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all w-full"
            >
              <option value="">Any event (workspace-wide)</option>
              @for (e of events(); track e.id) {
                <option [value]="e.id">{{ e.name }}</option>
              }
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Sponsor link
              <span class="text-slate-600 font-normal normal-case">
                (enables sponsor-first priority)
              </span>
            </label>
            <select
              [ngModel]="sponsorId()"
              (ngModelChange)="sponsorId.set($event)"
              class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all w-full"
            >
              <option value="">None</option>
              @for (s of sponsors(); track s.id) {
                <option [value]="s.id">{{ s.name }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Schedule + weight + active -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 border-t border-white/5 pt-4">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Starts
            </label>
            <input
              type="date"
              [ngModel]="startDate()"
              (ngModelChange)="startDate.set($event)"
              class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all w-full"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Ends
            </label>
            <input
              type="date"
              [ngModel]="endDate()"
              (ngModelChange)="endDate.set($event)"
              class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all w-full"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              Rotation weight
              <span class="text-slate-600 font-normal normal-case">
                (higher = shown more often)
              </span>
            </label>
            <input
              type="number"
              min="1"
              [ngModel]="weight()"
              (ngModelChange)="weight.set(+$event)"
              class="bg-slate-950 border border-white/10 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 rounded-xl px-4 py-2 text-xs text-white outline-none transition-all w-full"
            />
          </div>
          <label
            class="flex items-center justify-between gap-3 p-3 rounded-xl bg-slate-950/40 border border-white/5 cursor-pointer"
          >
            <div>
              <div class="text-xs font-bold text-white">Active</div>
              <div class="text-[10px] text-slate-400">Toggle off to pause instantly.</div>
            </div>
            <input
              type="checkbox"
              class="accent-violet-500 w-4 h-4"
              [checked]="isActive()"
              (change)="isActive.set(!isActive())"
            />
          </label>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-white/5 flex justify-end gap-2">
        <button
          type="button"
          (click)="close()"
          class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg transition cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="save()"
          [disabled]="isSaving()"
          class="px-4 py-2 bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white text-xs font-bold rounded-lg transition cursor-pointer inline-flex items-center gap-2"
        >
          @if (isSaving()) {
            <i class="fi fi-rr-spinner animate-spin text-xs"></i>
            Saving…
          } @else {
            {{ editingAd() ? 'Save changes' : 'Create ad' }}
          }
        </button>
      </div>
    </div>
  </div>
}
