<div class="flex h-screen overflow-hidden bg-slate-950 text-white w-full animate-pulse">
  <aside class="hidden lg:flex flex-col w-64 bg-slate-900 border-r border-white/10 p-5 gap-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-slate-800"></div>
      <div class="flex-1 space-y-2">
        <div class="h-4 bg-slate-800 rounded w-2/3"></div>
        <div class="h-3 bg-slate-800 rounded w-1/2"></div>
      </div>
    </div>
    <div class="space-y-4 mt-6">
      @for (item of sidebarItems; track item) {
        <div class="flex items-center gap-3">
          <div class="w-5 h-5 rounded bg-slate-800"></div>
          <div class="h-3 bg-slate-800 rounded flex-1"></div>
        </div>
      }
    </div>
  </aside>

  <main class="flex-1 p-6 lg:p-10 flex flex-col gap-6 overflow-hidden">
    <div class="flex items-center justify-between pb-6 border-b border-white/10">
      <div class="w-64 h-9 bg-slate-900 border border-white/10 rounded-xl"></div>
      <div class="flex items-center gap-4">
        <div class="w-8 h-8 rounded-full bg-slate-900 border border-white/10"></div>
        <div class="w-8 h-8 rounded-full bg-slate-900 border border-white/10"></div>
        <div class="w-8 h-8 rounded-xl bg-slate-900 border border-white/10"></div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between gap-4 pb-4">
      <div class="space-y-2">
        <div class="h-6 bg-slate-900 rounded w-48"></div>
        <div class="h-4 bg-slate-900 rounded w-96"></div>
      </div>
      <div class="w-32 h-9 bg-slate-900 rounded-xl"></div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
      @for (card of statCards; track card) {
        <div class="bg-slate-900/90 border border-white/10 rounded-xl p-4 space-y-3">
          <div class="h-3 bg-slate-800 rounded w-2/3"></div>
          <div class="h-6 bg-slate-800 rounded w-1/3"></div>
        </div>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
      @for (game of liveGames; track game) {
        <div class="bg-slate-900 border border-white/10 rounded-xl p-4 space-y-4">
          <div class="flex justify-between">
            <div class="w-16 h-4 bg-slate-800 rounded"></div>
            <div class="w-12 h-4 bg-slate-800 rounded"></div>
          </div>
          <div class="flex items-center justify-between">
            <div class="w-10 h-10 rounded-xl bg-slate-800"></div>
            <div class="w-8 h-4 bg-slate-800 rounded"></div>
            <div class="w-10 h-10 rounded-xl bg-slate-800"></div>
          </div>
          <div class="h-3 bg-slate-800 rounded w-full"></div>
        </div>
      }
    </div>
  </main>
</div>
