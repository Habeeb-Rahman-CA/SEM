<div class="h-full overflow-y-auto min-h-0 pr-1">
  <app-workspace-dashboard
    [workspace]="workspace()"
    [activeTab]="activeTab()"
    (activeTabChange)="onDashboardActiveTabChange($event)"
    [liveMatches]="liveMatches()"
    [upcomingMatches]="upcomingMatches()"
    [completedMatches]="completedMatches()"
    [runningCompetitions]="runningCompetitions()"
    [topScorers]="topScorers()"
    [topRatedPlayers]="topRatedPlayers()"
    [teamsCount]="teams().length"
    [playersCount]="players().length"
    [eventsCount]="events().length"
    [venuesCount]="venues().length"
    [membersCount]="members().length"
    [teams]="teams()"
    [players]="players()"
    [events]="events()"
    [venues]="venues()"
    [members]="members()"
    [notifications]="notifications()"
    [isOverviewLoading]="isOverviewLoading()"
    [canCreateEvent]="canCreateEvent()"
    [canManageTeams]="canManageTeams()"
    [canManagePlayers]="canManagePlayers()"
    [canManageVenues]="canManageVenues()"
    [selectedOverviewCompId]="selectedOverviewCompId()"
    (selectedOverviewCompIdChange)="selectedOverviewCompIdChange.emit($event)"
    [selectedOverviewComp]="selectedOverviewComp()"
    (selectedOverviewCompChange)="selectedOverviewCompChange.emit($event)"
    (enterLiveMatch)="enterLiveMatch.emit($event)"
  />
</div>
