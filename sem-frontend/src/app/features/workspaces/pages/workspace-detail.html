<div
  class="min-h-screen bg-slate-950 text-white"
  appGlobalSearchHotkey
  (hotkeyTriggered)="onGlobalSearchHotkey()"
>
  @if (isLoading()) {
    <app-workspace-detail-skeleton />
  }

  @if (error()) {
    <app-workspace-detail-error [message]="error()" />
  }

  @if (!isLoading() && !error() && workspace()) {
    @if (getCurrentUserRoleSlug() === 'referee') {
      @if (!selectedMatch()) {
        <app-referee-dashboard
          [workspace]="workspace()"
          [matches]="allWorkspaceMatches()"
          [teams]="teams()"
          [venues]="venues()"
          (enterMatch)="onSelectMatch($event)"
          (signOut)="onSignOut()"
          (refreshRequested)="onRefereeDashboardRefresh($event)"
        />
      } @else {
        <app-referee-match-console
          [workspace]="workspace()"
          [event]="selectedEvent()"
          [competition]="selectedCompetition()"
          [stage]="selectedStage()"
          [match]="selectedMatch()"
          [players]="players()"
          [teams]="teams()"
          [matchLineup]="matchLineup()"
          [canScore]="hasPermission('match.score')"
          (back)="onSelectMatch(null)"
          (matchCompleted)="onMatchCompleted()"
          (matchUpdated)="onMatchUpdated($event)"
          (openLineupModal)="openLineupModal()"
        />
      }

      <app-lineup-modal
        [(isOpen)]="isLineupModalOpen"
        [workspace]="workspace()"
        [selectedEvent]="selectedEvent()"
        [selectedCompetition]="selectedCompetition()"
        [selectedStage]="selectedStage()"
        [selectedMatch]="selectedMatch()"
        [players]="players()"
        [matchLineup]="matchLineup()"
        (lineupSaved)="onLineupSaved($event)"
      />
    } @else {
      <div
        class="flex flex-col lg:flex-row h-screen overflow-hidden bg-slate-950 text-white w-full"
      >
        <app-sidebar
          [workspace]="workspace()"
          [(isSidebarOpen)]="isSidebarOpen"
          [(activeTab)]="activeTab"
          [membersCount]="members().length"
          [teamsCount]="teams().length"
          [playersCount]="players().length"
          [eventsCount]="events().length"
          [venuesCount]="venues().length"
          [hasSettingsPermission]="hasPermission('workspace.update')"
        />

        <main
          class="flex-1 flex flex-col min-w-0 h-full overflow-hidden p-6 lg:p-10 pb-24 lg:pb-10"
        >
          <app-topbar
            [workspace]="workspace()"
            [allWorkspaces]="allWorkspaces()"
            [(globalSearchQuery)]="globalSearchQuery"
            [(showGlobalSearchResults)]="showGlobalSearchResults"
            [searchResults]="globalSearchResults()"
            [(isNotificationOpen)]="isNotificationOpen"
            [pendingInvitations]="pendingInvitations()"
            [notifications]="notifications()"
            [unreadNotificationsCount]="unreadNotificationsCount()"
            [isProcessingInvitation]="isProcessingInvitation()"
            [(isUserDropdownOpen)]="isUserDropdownOpen"
            [currentUser]="authService.currentUser()"
            [userRoleSlug]="getCurrentUserRoleSlug()"
            [isUploadingAvatar]="isUploadingAvatar()"
            (switchWorkspace)="onSwitchWorkspace($event)"
            (selectTeam)="selectGlobalTeam($event)"
            (selectPlayer)="selectGlobalPlayer($event)"
            (selectEvent)="selectGlobalEvent($event)"
            (selectCompetition)="selectGlobalCompetition($event)"
            (selectVenue)="selectGlobalVenue($event)"
            (selectMember)="selectGlobalMember($event)"
            (selectFile)="selectGlobalFile($event)"
            (acceptInvitation)="acceptInvite($event.workspaceId, $event.name)"
            (rejectInvitation)="rejectInvite($event.workspaceId, $event.name)"
            (markNotificationsRead)="markNotificationsAsRead()"
            (signOut)="onSignOut()"
            (avatarUpload)="onAvatarUpload($event)"
          />

          <div class="flex-1 min-h-0 mt-6">
            <app-workspace-tabs-outlet
              [activeTab]="activeTab()"
              (activeTabChange)="activeTab.set($event)"
              [workspace]="workspace()"
              (workspaceChange)="workspace.set($event)"
              [workspaceId]="workspace()?.id ?? ''"
              [members]="members()"
              (membersChange)="members.set($event)"
              [roles]="roles()"
              [assignableRoles]="assignableRoles"
              [teams]="teams()"
              [players]="players()"
              [events]="events()"
              [venues]="venues()"
              [notifications]="notifications()"
              [matches]="matches()"
              [matchLineup]="matchLineup()"
              [liveMatches]="overviewLiveMatches()"
              [upcomingMatches]="overviewUpcomingMatches()"
              [completedMatches]="overviewCompletedMatches()"
              [runningCompetitions]="overviewRunningCompetitions()"
              [topScorers]="overviewTopScorers()"
              [topRatedPlayers]="overviewTopRatedPlayers()"
              [isOverviewLoading]="isOverviewLoading()"
              [selectedOverviewCompId]="selectedOverviewCompId()"
              (selectedOverviewCompIdChange)="selectedOverviewCompId.set($event)"
              [selectedOverviewComp]="selectedOverviewComp()"
              (selectedOverviewCompChange)="selectedOverviewComp.set($event)"
              (enterLiveMatch)="onEnterLiveMatchFromOverview($event)"
              [selectedEvent]="selectedEvent()"
              (selectedEventChange)="selectedEvent.set($event)"
              [competitions]="competitions()"
              (competitionsChange)="competitions.set($event)"
              [selectedCompetition]="selectedCompetition()"
              (selectedCompetitionChange)="selectedCompetition.set($event)"
              [stages]="stages()"
              (stagesChange)="stages.set($event)"
              [selectedStage]="selectedStage()"
              (selectedStageChange)="selectedStage.set($event)"
              [selectedMatch]="selectedMatch()"
              (selectedMatchChange)="selectedMatch.set($event)"
              (matchesChange)="matches.set($event)"
              (matchLineupChange)="matchLineup.set($event)"
              [activeCompetitionTab]="activeCompetitionTab()"
              (activeCompetitionTabChange)="activeCompetitionTab.set($event)"
              (eventsChange)="events.set($event)"
              [selectedFileId]="selectedFileId()"
              [selectedTeamId]="selectedTeamId()"
              (selectedTeamIdChange)="selectedTeamId.set($event)"
              [selectedPlayerId]="selectedPlayerId()"
              (selectedPlayerIdChange)="selectedPlayerId.set($event)"
              [canInviteMember]="hasPermission('member.invite')"
              [canUpdateMember]="hasPermission('member.update')"
              [canRemoveMember]="hasPermission('member.remove')"
              [canManageTeams]="hasPermission('team.manage')"
              [canManagePlayers]="hasPermission('player.manage')"
              [canManageVenues]="hasPermission('workspace.update')"
              [canCreateEvent]="hasPermission('event.create')"
              (addTeam)="onAddTeam()"
              (editTeam)="onEditTeam($event)"
              (deleteTeam)="onDeleteTeam($event)"
              (teamsImported)="onTeamsImported($event)"
              (addPlayer)="onAddPlayer()"
              (editPlayer)="onEditPlayer($event)"
              (deletePlayer)="onDeletePlayer($event)"
              (playersImported)="onPlayersImported($event)"
              (addVenue)="onAddVenue()"
              (editVenue)="onEditVenue($event)"
              (deleteVenue)="onDeleteVenue($event)"
            />

            <app-player-modal
              [isOpen]="isPlayerModalOpen()"
              [player]="editingPlayer()"
              [workspaceId]="workspace()?.id || ''"
              [members]="members()"
              [teams]="teams()"
              (close)="closePlayerModal()"
              (save)="onPlayerSaved($event)"
            />

            <app-venue-modal
              [isOpen]="isVenueModalOpen()"
              [venue]="editingVenue()"
              [workspaceId]="workspace()?.id || ''"
              (close)="closeVenueModal()"
              (save)="onVenueSaved($event)"
            />
          </div>
        </main>
      </div>

      <app-bottom-nav
        [workspaceId]="workspace()?.id ?? null"
        [activeKey]="bottomNavKey()"
        (tabChanged)="onBottomNavTab($event)"
      />
    }
  }
</div>
