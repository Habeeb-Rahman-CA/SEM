<div class="flex flex-col gap-2 pt-4 border-t border-white/5 mt-6 max-w-md">
  <label class="text-[10px] font-bold text-slate-400 uppercase"
    >Complete Match & Record Result</label
  >
  <div class="flex gap-2">
    <select
      #matchResultSelect
      class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none"
    >
      <option value="">Select Match Result</option>
      <option value="Home Win">Home Win ({{ match().homeTeam?.name }})</option>
      <option value="Away Win">Away Win ({{ match().awayTeam?.name }})</option>
      <option value="Draw">Draw</option>
      <option value="Walkover (Home Win)">Walkover ({{ match().homeTeam?.name }} Win)</option>
      <option value="Walkover (Away Win)">Walkover ({{ match().awayTeam?.name }} Win)</option>
      <option value="Abandoned">Abandoned</option>
      <option value="Cancelled">Cancelled</option>
    </select>
    <button
      (click)="endMatch.emit(matchResultSelect.value); matchResultSelect.value = ''"
      [disabled]="!matchResultSelect.value"
      class="px-4 py-2 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 text-white text-xs font-bold rounded-xl cursor-pointer transition-all flex items-center gap-1.5 animate-pulse"
    >
      <i class="fi fi-rr-flag-checkered"></i> Complete Match
    </button>
  </div>
</div>
