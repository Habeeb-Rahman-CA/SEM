<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  @for (side of sides(); track side.key) {
    <div
      class="p-6 rounded-2xl bg-slate-900 border border-white/10 flex flex-col items-center gap-4 text-center shadow-xl"
    >
      <app-avatar
        [name]="side.team?.name || side.fallback"
        [logoUrl]="side.team?.logoUrl"
        customClass="w-16 h-16 rounded-2xl"
        textClass="text-lg font-bold text-white"
      />
      <span class="text-sm font-black text-white">{{ side.team?.name || side.name }}</span>

      <div class="flex items-center gap-4">
        <button
          (click)="refereeGoal.emit({ teamId: side.teamId, delta: -1 })"
          class="w-12 h-12 rounded-xl bg-slate-950 hover:bg-slate-800 border border-white/10 flex items-center justify-center text-lg text-white font-extrabold transition-all cursor-pointer"
        >
          -1
        </button>
        <span class="text-4xl font-black text-white w-12">{{ side.score }}</span>
        <button
          (click)="refereeGoal.emit({ teamId: side.teamId, delta: 1 })"
          class="w-12 h-12 rounded-xl bg-violet-600 hover:bg-violet-550 flex items-center justify-center text-lg text-white font-extrabold shadow-md shadow-violet-650/20 transition-all cursor-pointer"
        >
          +1
        </button>
      </div>

      <div class="flex gap-2 w-full mt-2">
        <button
          (click)="refereeCard.emit({ teamId: side.teamId, cardType: 'yellow' })"
          class="flex-1 py-3 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5 border-0"
        >
          <span class="w-2.5 h-3.5 bg-amber-400 rounded-sm"></span> Yellow Card
        </button>
        <button
          (click)="refereeCard.emit({ teamId: side.teamId, cardType: 'red' })"
          class="flex-1 py-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5 border-0"
        >
          <span class="w-2.5 h-3.5 bg-rose-500 rounded-sm"></span> Red Card
        </button>
      </div>
    </div>
  }
</div>
