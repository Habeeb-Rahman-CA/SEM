<div class="flex flex-col gap-4">
  <h4 class="text-sm font-bold text-white uppercase tracking-wider border-b border-white/5 pb-2">
    Football Match Settings
  </h4>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5 text-left max-w-xs">
      <label class="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1.5">
        Half Duration (Minutes)
        <app-help-tooltip
          text="Duration of each half in minutes. Standard football uses 45-minute halves. Adjust this for shorter youth matches or custom formats."
          position="right"
        />
      </label>
      <input
        #halfDuration
        type="number"
        [value]="$any(match()).config?.halfDuration || 45"
        min="1"
        max="90"
        class="bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none"
      />
    </div>

    @if (supportsKnockoutOptions()) {
      <div class="flex flex-col gap-2.5 text-left border-t border-white/5 pt-2 max-w-xs">
        <label class="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1.5">
          Knockout Options
          <app-help-tooltip
            text="Extra Time and Penalty Shootout options are only available in Knockout and Group+Knockout stages. These are used to resolve tied matches in elimination rounds."
            position="right"
          />
        </label>
        <div class="flex flex-col gap-2">
          <label class="text-xs text-white flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              [checked]="enableExtraTime()"
              (change)="enableExtraTime.set($any($event.target).checked)"
              class="accent-violet-500 rounded border-white/10"
            />
            Enable Extra Time
            <app-help-tooltip
              text="If the match is tied after normal time, play two additional periods (e.g. 2×15 minutes) before deciding the winner."
              position="right"
            />
          </label>
          @if (enableExtraTime()) {
            <div class="flex flex-col gap-1 text-left pl-6 mt-1">
              <label class="text-[9px] font-bold text-slate-400 uppercase flex items-center gap-1.5"
                >Extra Time Half Duration (Mins)
                <app-help-tooltip
                  text="Duration of each extra time period. FIFA standard is 15 minutes per half. Must be between 1 and 45 minutes."
                  position="right"
                />
              </label>
              <input
                #extraTimeHalfDurationInput
                type="number"
                [value]="extraTimeHalfDuration()"
                (input)="extraTimeHalfDuration.set(+extraTimeHalfDurationInput.value || 15)"
                min="1"
                max="45"
                class="bg-slate-950 border border-white/10 rounded-xl px-2.5 py-1.5 text-xs text-white placeholder-slate-600 outline-none w-32"
              />
            </div>
          }
          <label class="text-xs text-white flex items-center gap-2 cursor-pointer">
            <input
              type="checkbox"
              [checked]="enablePenaltyShootout()"
              (change)="enablePenaltyShootout.set($any($event.target).checked)"
              class="accent-violet-500 rounded border-white/10"
            />
            Enable Penalty Shootout
            <app-help-tooltip
              text="If the match is still tied after Extra Time, a penalty shootout determines the winner. Each team takes alternating penalty kicks from the spot."
              position="right"
            />
          </label>
        </div>
      </div>
    }
  </div>
  <button
    (click)="emitStart(halfDuration.value)"
    class="w-full py-2 bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold rounded-xl cursor-pointer transition-all"
  >
    Start Match
  </button>
</div>
