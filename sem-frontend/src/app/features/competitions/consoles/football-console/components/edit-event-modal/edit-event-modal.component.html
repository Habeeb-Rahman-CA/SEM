@if (editingEvent()) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div (click)="cancel.emit()" class="absolute inset-0 bg-slate-950/80 backdrop-blur-lg"></div>
    <div
      class="relative z-10 w-full max-w-sm bg-slate-900 border border-white/10 rounded-2xl shadow-2xl shadow-black/80 overflow-hidden"
    >
      <div
        class="px-6 py-4 border-b border-white/5 flex items-center justify-between bg-slate-950/30"
      >
        <div class="flex items-center gap-2">
          <i class="fi fi-rr-pen-field text-amber-400 text-sm"></i>
          <h3 class="text-sm font-black text-white">Edit Event</h3>
        </div>
        <button
          (click)="cancel.emit()"
          class="h-7 w-7 rounded-lg bg-white/5 border border-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-all flex items-center justify-center cursor-pointer"
        >
          <i class="fi fi-rr-cross text-xs"></i>
        </button>
      </div>
      <div class="p-6 flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400"
            >Event Type</label
          >
          <div
            class="px-3 py-2 bg-slate-950/60 border border-white/5 rounded-xl text-xs font-bold text-slate-300"
          >
            {{ editingEvent()!.type | eventTypeLabel }}
            @if (editingEvent()!.goalType) {
              ({{ editingEvent()!.goalType }})
            }
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400"
            ><i class="fi fi-rr-clock text-violet-400"></i> Minute</label
          >
          <input
            type="number"
            [value]="minute()"
            (input)="minute.set(+$any($event.target).value)"
            min="0"
            max="150"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-sm font-bold text-white outline-none focus:border-violet-500/50 transition-colors"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400"
            ><i class="fi fi-rr-memo text-violet-400"></i> Referee Note (Optional)</label
          >
          <textarea
            [value]="note()"
            (input)="note.set($any($event.target).value)"
            placeholder="Add a correction note or clarification…"
            rows="2"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors resize-none"
          ></textarea>
        </div>
        <div
          class="flex items-start gap-2 text-[10px] text-amber-400 bg-amber-500/5 border border-amber-500/15 rounded-xl px-3 py-2.5"
        >
          <i class="fi fi-rr-exclamation-triangle text-amber-400 flex-shrink-0 mt-0.5"></i>
          <span>All changes are logged in the event's audit trail for transparency.</span>
        </div>
      </div>
      <div
        class="px-6 py-4 border-t border-white/5 bg-slate-950/30 flex items-center justify-end gap-3"
      >
        <button
          (click)="cancel.emit()"
          class="px-4 py-2 bg-slate-800 border border-white/10 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition-all cursor-pointer"
        >
          Cancel
        </button>
        <button
          (click)="emitSave()"
          class="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-2 shadow-md shadow-violet-600/20"
        >
          <i class="fi fi-rr-check text-xs"></i> Save Changes
        </button>
      </div>
    </div>
  </div>
}
