<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  <!-- Left Columns: Live Console Controls & Visuals -->
  <div class="lg:col-span-2 flex flex-col gap-6">
    <app-football-mode-selector
      [mode]="consoleMode()"
      [showPublish]="consoleMode() === 'statistician' && hasUnpublishedEvents()"
      (modeChange)="consoleMode.set($event)"
      (publish)="onPublishStats()"
    />

    @if (consoleMode() === 'referee') {
      @if (match().status !== 'completed' && canScore()) {
        <app-football-referee-quick-entry
          [match]="match()"
          (refereeGoal)="onRefereeGoal($event)"
          (refereeCard)="onRefereeCard($event)"
        />
      }
    }

    <app-football-scoreboard-header
      [match]="match()"
      [players]="players()"
      [elapsedSeconds]="localElapsedSeconds()"
      [consoleMode]="consoleMode()"
      [hasUnpublishedEvents]="hasUnpublishedEvents()"
      [draftHomeScore]="draftHomeScore()"
      [draftAwayScore]="draftAwayScore()"
      [periodStatus]="periodStatus()"
    />

    @if (consoleMode() === 'statistician' && match().status !== 'completed' && canScore()) {
      <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 flex flex-col gap-6">
        @if (!match().liveData?.started) {
          <app-football-match-config-form
            [match]="match()"
            [stage]="stage()"
            (startMatch)="onStartFootballMatch($event)"
          />
        } @else {
          <app-football-period-controls
            [match]="match()"
            [periodStatus]="periodStatus()"
            [isHalfTime]="isFootballHalfTime()"
            [isExtra1Pending]="isFootballExtra1Pending()"
            [isFullTime]="isFootballFullTime()"
            [isShootoutPending]="isFootballShootoutPending()"
            (toggleTimer)="onToggleFootballTimer()"
            (startSecondHalf)="onStartSecondHalf()"
            (startFirstExtraHalf)="onStartFirstExtraHalf()"
            (startSecondExtraHalf)="onStartSecondExtraHalf()"
            (startPenaltyShootout)="onStartPenaltyShootout()"
          />

          @if (match().liveData?.currentHalf !== 5) {
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <app-football-team-events-panel
                [teamName]="match().homeTeam?.name"
                [teamId]="match().homeTeamId!"
                [players]="homePlayers()"
                [benchPlayers]="homeBenchPlayers()"
                (recordGoal)="onRecordFootballGoal($event)"
                (recordCard)="onRecordFootballCard($event)"
                (recordPenalty)="onRecordFootballPenalty($event)"
                (recordSubstitution)="onRecordFootballSubstitution($event)"
              />
              <app-football-team-events-panel
                [teamName]="match().awayTeam?.name"
                [teamId]="match().awayTeamId!"
                [players]="awayPlayers()"
                [benchPlayers]="awayBenchPlayers()"
                (recordGoal)="onRecordFootballGoal($event)"
                (recordCard)="onRecordFootballCard($event)"
                (recordPenalty)="onRecordFootballPenalty($event)"
                (recordSubstitution)="onRecordFootballSubstitution($event)"
              />
            </div>
          } @else {
            <app-football-penalty-shootout
              [match]="match()"
              [homePlayers]="homePlayers()"
              [awayPlayers]="awayPlayers()"
              (recordShootoutPenalty)="onRecordFootballShootoutPenalty($event)"
            />
          }

          <app-football-end-match-form
            [match]="match()"
            (endMatch)="onEndMatchWithResult($event)"
          />
        }
      </div>
    }
  </div>

  <!-- Right Column: Match Timeline Panel -->
  <div class="flex flex-col gap-6">
    <app-football-timeline-panel
      [match]="match()"
      [players]="players()"
      [canScore]="canScore()"
      (editEvent)="openEditEvent($event)"
      (deleteEvent)="deleteEvent($event)"
    />
  </div>
</div>

<div class="mt-6">
  <app-match-evidence-panel
    [workspaceId]="workspaceId()"
    [eventId]="eventId()"
    [competitionId]="competitionId()"
    [stageId]="stageId()"
    [match]="match()"
    [canScore]="canScore()"
    (matchUpdated)="matchUpdated.emit($event)"
  />
</div>

<div class="mt-6">
  <app-match-highlights-panel
    [workspaceId]="workspaceId()"
    [eventId]="eventId()"
    [competitionId]="competitionId()"
    [stageId]="stageId()"
    [match]="match()"
    [canScore]="canScore()"
    (matchUpdated)="matchUpdated.emit($event)"
  />
</div>

<app-football-edit-event-modal
  [editingEvent]="editingEvent()"
  (save)="saveEditedEvent($event)"
  (cancel)="cancelEditEvent()"
/>
