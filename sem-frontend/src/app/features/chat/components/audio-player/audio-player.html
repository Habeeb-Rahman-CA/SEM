<div
  class="relative flex items-center gap-3 p-3 bg-slate-900/90 hover:bg-slate-900 border border-white/10 rounded-2xl shadow-lg backdrop-blur-md max-w-sm transition-all group select-none"
>
  <audio
    #audioRef
    [src]="src()"
    (loadedmetadata)="onLoadedMetadata()"
    (timeupdate)="onTimeUpdate()"
    (ended)="onEnded()"
    class="hidden"
  ></audio>

  <!-- Play / Pause Circular Button -->
  <button
    (click)="togglePlay()"
    [title]="isPlaying() ? 'Pause Audio' : 'Play Voice Message'"
    class="w-10 h-10 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white flex items-center justify-center shadow-lg shadow-emerald-500/20 transition-all shrink-0 cursor-pointer"
  >
    <i [class]="isPlaying() ? 'fi fi-rr-pause text-base' : 'fi fi-rr-play text-base ml-0.5'"></i>
  </button>

  <!-- Middle: Title, Waveform Bars Preview, Time -->
  <div class="flex-1 min-w-0 space-y-1.5">
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold text-white truncate flex items-center gap-1.5">
        <i class="fi fi-rr-microphone text-emerald-400 text-xs"></i>
        <span>{{ title() }}</span>
      </span>
      <span class="text-[10px] font-mono text-slate-400">
        {{ formattedCurrentTime() }} / {{ formattedDuration() }}
      </span>
    </div>

    <!-- Waveform Visual Preview Bars -->
    <div class="flex items-center gap-0.5 h-6 w-full cursor-pointer py-1">
      @for (barHeight of waveformBars(); track $index) {
        <div
          (click)="seek($index)"
          [style.height.%]="barHeight"
          [class.bg-emerald-400]="($index / waveformBars().length) * 100 <= progressPercentage()"
          [class.shadow-emerald-400\/50]="
            ($index / waveformBars().length) * 100 <= progressPercentage()
          "
          [class.bg-white\/20]="($index / waveformBars().length) * 100 > progressPercentage()"
          class="flex-1 rounded-full transition-colors duration-75 hover:bg-emerald-300"
        ></div>
      }
    </div>
  </div>

  <!-- Right: Playback Speed & Noise Reduction Toggles -->
  <div class="flex flex-col items-end gap-1 shrink-0 border-l border-white/10 pl-2.5">
    <!-- Speed Toggle Button -->
    <button
      (click)="cyclePlaybackSpeed()"
      title="Toggle Playback Speed"
      class="px-2 py-0.5 rounded-lg bg-white/5 hover:bg-white/10 text-[10px] font-bold font-mono text-emerald-400 hover:text-emerald-300 transition-colors border border-white/10 cursor-pointer"
    >
      {{ playbackSpeed() }}x
    </button>

    <!-- Noise Reduction Toggle Badge -->
    <button
      (click)="toggleNoiseReduction()"
      [title]="
        isNoiseReductionActive()
          ? 'Noise Reduction Active (High-Pass 300Hz Filter)'
          : 'Noise Reduction Off'
      "
      [class.bg-emerald-500\/20]="isNoiseReductionActive()"
      [class.border-emerald-500\/40]="isNoiseReductionActive()"
      [class.text-emerald-300]="isNoiseReductionActive()"
      [class.text-slate-500]="!isNoiseReductionActive()"
      class="px-1.5 py-0.5 rounded-lg bg-white/5 text-[9px] font-bold transition-all border border-white/5 cursor-pointer flex items-center gap-1"
    >
      <i class="fi fi-rr-headset text-[9px]"></i>
      <span>NR</span>
    </button>
  </div>
</div>
