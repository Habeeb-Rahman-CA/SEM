<a
  [href]="preview.url"
  target="_blank"
  rel="noopener noreferrer"
  class="block my-2 max-w-md rounded-2xl bg-slate-950/80 hover:bg-slate-900/90 border border-violet-500/30 hover:border-violet-500/50 shadow-xl overflow-hidden transition-all duration-200 group no-underline"
>
  <!-- Optional Open Graph Thumbnail Preview -->
  @if (preview.thumbnailUrl) {
    <div class="w-full h-36 bg-slate-900 overflow-hidden relative border-b border-white/10">
      <img
        [src]="preview.thumbnailUrl"
        [alt]="preview.title"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
      />
      <div
        class="absolute bottom-2 left-2 px-2 py-0.5 rounded-full bg-slate-950/80 backdrop-blur-md text-[10px] text-slate-300 font-bold border border-white/10 flex items-center gap-1"
      >
        <i class="fi fi-rr-link text-violet-400"></i>
        <span>{{ domain }}</span>
      </div>
    </div>
  }

  <!-- Content Block -->
  <div class="p-3.5 space-y-1.5">
    <!-- Domain Header if no thumbnail -->
    @if (!preview.thumbnailUrl) {
      <div
        class="flex items-center gap-1.5 text-[10px] font-bold text-violet-400 uppercase tracking-wider"
      >
        <i class="fi fi-rr-globe"></i>
        <span>{{ preview.siteName || domain }}</span>
      </div>
    }

    <!-- Website Title -->
    <h4
      class="text-xs font-bold text-white group-hover:text-violet-300 transition-colors line-clamp-1"
    >
      {{ preview.title }}
    </h4>

    <!-- Description -->
    <p class="text-[11px] text-slate-400 line-clamp-2 leading-relaxed font-normal">
      {{ preview.description }}
    </p>

    <!-- URL footer -->
    <div class="pt-1 flex items-center gap-1 text-[10px] text-slate-500 font-mono truncate">
      <span class="truncate">{{ preview.url }}</span>
      <i
        class="fi fi-rr-arrow-up-right text-[9px] text-violet-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform shrink-0"
      ></i>
    </div>
  </div>
</a>
