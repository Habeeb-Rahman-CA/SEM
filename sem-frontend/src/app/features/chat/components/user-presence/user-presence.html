<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-150"
>
  <div
    class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-150"
  >
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-slate-950/40"
    >
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 rounded-xl bg-violet-600/20 border border-violet-500/30 flex items-center justify-center text-violet-400"
        >
          <i class="fi fi-rr-user-time text-base"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-white">Set Your Presence & Status</h3>
          <p class="text-[11px] text-slate-400">Control how teammates see your availability</p>
        </div>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-colors"
      >
        <i class="fi fi-rr-cross text-xs"></i>
      </button>
    </div>

    <div class="p-6 space-y-5 overflow-y-auto max-h-[75vh]">
      <!-- Status Options List -->
      <div class="space-y-2">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
          Availability Status
        </label>
        <div class="space-y-1.5">
          @for (option of statusOptions; track option.type) {
            <button
              type="button"
              (click)="selectedStatus.set(option.type)"
              [class.bg-violet-600\/20]="selectedStatus() === option.type"
              [class.border-violet-500\/50]="selectedStatus() === option.type"
              [class.bg-white\/5]="selectedStatus() !== option.type"
              [class.border-white\/10]="selectedStatus() !== option.type"
              class="w-full p-3 rounded-2xl border text-left flex items-center justify-between transition-all hover:bg-white/10 cursor-pointer group"
            >
              <div class="flex items-center gap-3">
                <app-user-presence-badge [status]="option.type" />
                <div>
                  <div class="text-xs font-bold text-white flex items-center gap-1.5">
                    <span>{{ option.label }}</span>
                  </div>
                  <div class="text-[10px] text-slate-400">{{ option.description }}</div>
                </div>
              </div>
              <div
                class="w-5 h-5 rounded-full border border-white/20 flex items-center justify-center"
              >
                @if (selectedStatus() === option.type) {
                  <div class="w-2.5 h-2.5 rounded-full bg-violet-400"></div>
                }
              </div>
            </button>
          }
        </div>
      </div>

      <!-- Custom Status Section -->
      <div class="space-y-2 pt-2 border-t border-white/10">
        <div class="flex items-center justify-between">
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
            Custom Status Message
          </label>
          @if (customText()) {
            <button
              type="button"
              (click)="clearCustomStatus()"
              class="text-[10px] text-slate-400 hover:text-rose-400 transition-colors"
            >
              Clear
            </button>
          }
        </div>

        <div class="relative">
          <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
            <i [class]="customIcon()"></i>
          </div>
          <input
            type="text"
            [ngModel]="customText()"
            (ngModelChange)="customText.set($event)"
            placeholder="What's your status? (e.g. In a meeting)"
            maxlength="80"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-white/10 focus:border-violet-500 rounded-xl text-xs text-white placeholder-slate-500 outline-none transition-colors"
          />
        </div>

        <!-- Presets -->
        <div class="pt-1">
          <span class="text-[10px] text-slate-400 font-medium block mb-1.5"
            >Suggested status presets:</span
          >
          <div class="flex flex-wrap gap-1.5">
            @for (preset of presetCustomStatuses; track preset.text) {
              <button
                type="button"
                (click)="selectPreset(preset)"
                class="px-2.5 py-1 rounded-xl bg-white/5 hover:bg-violet-600/20 border border-white/10 hover:border-violet-500/40 text-[11px] text-slate-300 hover:text-white transition-all flex items-center gap-1.5 cursor-pointer"
              >
                <i [class]="preset.icon + ' text-violet-400 text-[10px]'"></i>
                <span>{{ preset.text }}</span>
              </button>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div
      class="px-6 py-4 border-t border-white/10 bg-slate-950/40 flex items-center justify-end gap-3"
    >
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-xs font-semibold transition-colors cursor-pointer"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="save()"
        class="px-5 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-semibold shadow-lg shadow-violet-600/20 transition-all cursor-pointer"
      >
        Save Status
      </button>
    </div>
  </div>
</div>
