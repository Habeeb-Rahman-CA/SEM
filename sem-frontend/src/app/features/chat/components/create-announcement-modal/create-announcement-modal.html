<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-200"
>
  <div
    class="w-full max-w-lg bg-slate-900 border border-amber-500/30 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200"
  >
    <!-- Modal Header -->
    <div
      class="px-6 py-4 bg-gradient-to-r from-amber-950/80 via-slate-900 to-amber-900/40 border-b border-amber-500/20 flex items-center justify-between"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center text-lg shadow-lg shadow-amber-500/10 animate-pulse"
        >
          <i class="fi fi-rr-bullhorn"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white tracking-wide">Publish Announcement</h3>
          <p class="text-xs text-amber-200/80">
            Highlight crucial workspace broadcasts for your team
          </p>
        </div>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="w-8 h-8 rounded-full hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
      >
        <i class="fi fi-rr-cross text-xs"></i>
      </button>
    </div>

    <!-- Scrollable Body -->
    <div class="p-6 overflow-y-auto space-y-5 scrollbar-thin scrollbar-thumb-white/10">
      <!-- Auto-Pinned Notice Banner -->
      <div
        class="px-4 py-2.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs flex items-center gap-2.5"
      >
        <i class="fi fi-rr-thumbtack text-amber-400 shrink-0"></i>
        <span
          >Announcements are <strong>automatically pinned</strong> to the top of the chat
          timeline.</span
        >
      </div>

      <!-- Priority Level Selector -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">
          Broadcast Priority Level
        </label>
        <div class="grid grid-cols-3 gap-2">
          <!-- Urgent -->
          <button
            type="button"
            (click)="priority.set('urgent')"
            [class.bg-rose-500\/20]="priority() === 'urgent'"
            [class.border-rose-500]="priority() === 'urgent'"
            [class.text-rose-300]="priority() === 'urgent'"
            [class.bg-white\/5]="priority() !== 'urgent'"
            [class.border-white\/10]="priority() !== 'urgent'"
            [class.text-slate-400]="priority() !== 'urgent'"
            class="p-2.5 rounded-2xl border text-center transition-all cursor-pointer flex flex-col items-center gap-1"
          >
            <i class="fi fi-rr-alarm-clock text-base"></i>
            <span class="text-xs font-bold">Urgent</span>
          </button>

          <!-- Important -->
          <button
            type="button"
            (click)="priority.set('important')"
            [class.bg-amber-500\/20]="priority() === 'important'"
            [class.border-amber-500]="priority() === 'important'"
            [class.text-amber-300]="priority() === 'important'"
            [class.bg-white\/5]="priority() !== 'important'"
            [class.border-white\/10]="priority() !== 'important'"
            [class.text-slate-400]="priority() !== 'important'"
            class="p-2.5 rounded-2xl border text-center transition-all cursor-pointer flex flex-col items-center gap-1"
          >
            <i class="fi fi-rr-star text-base"></i>
            <span class="text-xs font-bold">Important</span>
          </button>

          <!-- General Notice -->
          <button
            type="button"
            (click)="priority.set('notice')"
            [class.bg-sky-500\/20]="priority() === 'notice'"
            [class.border-sky-500]="priority() === 'notice'"
            [class.text-sky-300]="priority() === 'notice'"
            [class.bg-white\/5]="priority() !== 'notice'"
            [class.border-white\/10]="priority() !== 'notice'"
            [class.text-slate-400]="priority() !== 'notice'"
            class="p-2.5 rounded-2xl border text-center transition-all cursor-pointer flex flex-col items-center gap-1"
          >
            <i class="fi fi-rr-info text-base"></i>
            <span class="text-xs font-bold">Notice</span>
          </button>
        </div>
      </div>

      <!-- Headline / Title Field -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">
          Announcement Headline <span class="text-rose-400">*</span>
        </label>
        <input
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event)"
          placeholder="e.g., Mandatory Team Briefing & Venue Change Notice"
          class="w-full px-4 py-2.5 rounded-2xl bg-slate-950/80 border border-white/15 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-500 transition-colors font-semibold"
        />
      </div>

      <!-- Details / Body Field -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">
          Announcement Details <span class="text-rose-400">*</span>
        </label>
        <textarea
          rows="4"
          [ngModel]="content()"
          (ngModelChange)="content.set($event)"
          placeholder="Provide comprehensive details about this announcement..."
          class="w-full px-4 py-3 rounded-2xl bg-slate-950/80 border border-white/15 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-amber-500 transition-colors scrollbar-thin resize-none"
        ></textarea>
      </div>

      <!-- Read Confirmation Toggle -->
      <div class="p-4 rounded-2xl bg-white/5 border border-white/10">
        <label class="flex items-center gap-3 cursor-pointer">
          <input
            type="checkbox"
            [ngModel]="requireReadConfirmation()"
            (ngModelChange)="requireReadConfirmation.set($event)"
            class="w-4 h-4 rounded text-amber-500 focus:ring-amber-400 border-white/20 bg-slate-950"
          />
          <div>
            <div class="text-xs font-bold text-white flex items-center gap-1.5">
              <i class="fi fi-rr-check-circle text-amber-400 text-xs"></i>
              <span>Require Read Confirmation</span>
            </div>
            <div class="text-[10px] text-slate-400">
              Members must click to acknowledge they have read this update
            </div>
          </div>
        </label>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div
      class="px-6 py-4 bg-slate-950/80 border-t border-white/10 flex items-center justify-end gap-3"
    >
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-2xl hover:bg-white/10 text-slate-300 text-xs font-bold transition-colors cursor-pointer"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="!title().trim() || !content().trim()"
        class="px-5 py-2 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <i class="fi fi-rr-bullhorn text-xs"></i>
        <span>Publish Announcement</span>
      </button>
    </div>
  </div>
</div>
