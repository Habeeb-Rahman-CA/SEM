<div class="relative inline-flex items-center gap-1 group">
  <!-- Status Checkmarks -->
  <button
    type="button"
    (click)="togglePopover($event)"
    [title]="
      status === 'sent'
        ? 'Sent'
        : status === 'delivered'
          ? 'Delivered'
          : isGroupChat && readBy.length > 0
            ? 'Seen by ' + readBy.length + ' members'
            : 'Seen'
    "
    class="flex items-center gap-0.5 transition-transform cursor-pointer"
  >
    @switch (status) {
      @case ('sent') {
        <i class="fi fi-rr-check text-slate-400 text-[11px]"></i>
      }
      @case ('delivered') {
        <i class="fi fi-rr-check-double text-slate-400 text-[11px]"></i>
      }
      @case ('read') {
        <i class="fi fi-rr-check-double text-sky-400 text-[11px] font-bold"></i>
      }
    }

    <!-- Multiple Readers Count Indicator for Group Chats -->
    @if (isGroupChat && readBy.length > 0) {
      <div class="flex items-center -space-x-1 ml-0.5">
        <span
          class="px-1.5 py-0.2 bg-sky-500/20 text-sky-300 rounded-full text-[9px] font-bold border border-sky-500/30"
        >
          Seen by {{ readBy.length }}
        </span>
      </div>
    }
  </button>

  <!-- Seen By Members Popover -->
  @if (showPopover()) {
    <div
      class="absolute bottom-full right-0 mb-2 w-56 bg-slate-900 border border-sky-500/30 rounded-2xl shadow-2xl p-3 text-xs z-50 animate-in zoom-in-95 duration-150"
    >
      <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-2">
        <span class="font-bold text-white text-[11px] flex items-center gap-1">
          <i class="fi fi-rr-eye text-sky-400"></i> Seen By ({{ readBy.length }})
        </span>
        <button
          type="button"
          (click)="showPopover.set(false)"
          class="text-slate-400 hover:text-white text-[10px]"
        >
          <i class="fi fi-rr-cross"></i>
        </button>
      </div>

      <div class="space-y-1.5 max-h-36 overflow-y-auto scrollbar-thin">
        @for (reader of readBy; track reader.userId) {
          <div class="flex items-center justify-between text-[11px]">
            <div class="flex items-center gap-1.5 truncate">
              <div
                class="w-4 h-4 rounded-full bg-sky-500/30 border border-sky-400/40 text-sky-200 text-[8px] font-bold flex items-center justify-center"
              >
                {{ reader.username ? reader.username.substring(0, 1).toUpperCase() : 'U' }}
              </div>
              <span class="text-slate-200 font-medium truncate">{{ reader.username }}</span>
            </div>
            <span class="text-[9px] text-slate-400 shrink-0">
              {{ reader.readAt ? (reader.readAt | date: 'shortTime') : 'Just now' }}
            </span>
          </div>
        }
      </div>
    </div>
  }
</div>
