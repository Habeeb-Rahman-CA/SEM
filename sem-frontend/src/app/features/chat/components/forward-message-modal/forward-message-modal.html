<div
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-4 animate-in fade-in duration-200"
>
  <div
    class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in zoom-in-95 duration-200"
  >
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-slate-900/80"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-2xl bg-sky-600/20 text-sky-400 border border-sky-500/30 flex items-center justify-center text-sm font-bold"
        >
          <i class="fi fi-rr-share-square"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-white">Forward Message</h3>
          <p class="text-[11px] text-slate-400">Select channel or recipient</p>
        </div>
      </div>

      <button
        type="button"
        (click)="close.emit()"
        class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white border border-white/10 flex items-center justify-center transition-colors cursor-pointer"
      >
        <i class="fi fi-rr-cross text-xs"></i>
      </button>
    </div>

    <!-- Message Preview Quote -->
    @if (message) {
      <div
        class="p-4 mx-4 mt-4 bg-slate-950/80 border border-white/10 rounded-2xl text-xs space-y-1"
      >
        <span class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">
          Forwarding Message from {{ message.senderName }}
        </span>
        <p class="text-slate-300 italic line-clamp-2">{{ message.content }}</p>
      </div>
    }

    <!-- Search Input -->
    <div class="px-4 pt-3">
      <div class="relative">
        <i class="fi fi-rr-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input
          type="text"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          placeholder="Search channels or team members..."
          class="w-full bg-slate-950 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500/50"
        />
      </div>
    </div>

    <!-- Target Selection List -->
    <div class="p-4 space-y-1.5 max-h-60 overflow-y-auto scrollbar-none">
      @for (item of filteredTargets(); track item.id) {
        <button
          type="button"
          (click)="selectTarget(item)"
          [class.bg-sky-600\/20]="selectedTarget()?.id === item.id"
          [class.border-sky-500\/40]="selectedTarget()?.id === item.id"
          [class.text-white]="selectedTarget()?.id === item.id"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 text-xs flex items-center justify-between transition-all cursor-pointer text-left"
        >
          <div class="flex items-center gap-2.5">
            <i [class]="item.icon + ' text-slate-400 text-xs'"></i>
            <span class="font-semibold">{{ item.name }}</span>
          </div>

          @if (selectedTarget()?.id === item.id) {
            <i class="fi fi-rr-check-circle text-sky-400 text-xs"></i>
          }
        </button>
      }
    </div>

    <!-- Actions -->
    <div
      class="px-6 py-4 border-t border-white/10 bg-slate-950/80 flex items-center justify-end gap-3"
    >
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs font-semibold border border-white/10 transition-colors cursor-pointer"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="confirmForward()"
        [disabled]="!selectedTarget()"
        class="px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs font-bold shadow-lg shadow-sky-600/30 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <i class="fi fi-rr-share-square text-xs"></i>
        <span>Send Forward</span>
      </button>
    </div>
  </div>
</div>
