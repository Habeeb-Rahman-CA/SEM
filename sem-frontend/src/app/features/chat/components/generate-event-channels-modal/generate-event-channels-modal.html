<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-in fade-in duration-150"
>
  <div
    class="w-full max-w-lg bg-slate-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in zoom-in-95 duration-150"
  >
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-white/10 flex items-center justify-between bg-slate-950/40 shrink-0"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-2xl bg-cyan-600/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400"
        >
          <i class="fi fi-rr-folder-tree text-lg"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-white">Generate Event Channels</h3>
          <p class="text-[11px] text-slate-400">
            Automatically build channel hierarchies for tournaments & events
          </p>
        </div>
      </div>
      <button
        type="button"
        (click)="close.emit()"
        class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-colors"
      >
        <i class="fi fi-rr-cross text-xs"></i>
      </button>
    </div>

    <div class="p-6 space-y-5 overflow-y-auto scrollbar-thin flex-1">
      <!-- Preset Choice Chips -->
      <div class="space-y-2">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
          Event Preset Template
        </label>
        <div class="grid grid-cols-3 gap-2">
          <button
            type="button"
            (click)="selectPreset('tournament')"
            [class.bg-cyan-600\/20]="selectedPreset() === 'tournament'"
            [class.border-cyan-500\/50]="selectedPreset() === 'tournament'"
            [class.text-white]="selectedPreset() === 'tournament'"
            [class.bg-white\/5]="selectedPreset() !== 'tournament'"
            [class.border-white\/10]="selectedPreset() !== 'tournament'"
            [class.text-slate-400]="selectedPreset() !== 'tournament'"
            class="p-2.5 rounded-xl border text-center transition-all hover:bg-white/10 cursor-pointer"
          >
            <i class="fi fi-rr-trophy text-amber-400 text-sm mb-1 block"></i>
            <span class="text-xs font-bold block">Tournament</span>
          </button>

          <button
            type="button"
            (click)="selectPreset('league')"
            [class.bg-cyan-600\/20]="selectedPreset() === 'league'"
            [class.border-cyan-500\/50]="selectedPreset() === 'league'"
            [class.text-white]="selectedPreset() === 'league'"
            [class.bg-white\/5]="selectedPreset() !== 'league'"
            [class.border-white\/10]="selectedPreset() !== 'league'"
            [class.text-slate-400]="selectedPreset() !== 'league'"
            class="p-2.5 rounded-xl border text-center transition-all hover:bg-white/10 cursor-pointer"
          >
            <i class="fi fi-rr-shield-check text-emerald-400 text-sm mb-1 block"></i>
            <span class="text-xs font-bold block">League</span>
          </button>

          <button
            type="button"
            (click)="selectPreset('corporate')"
            [class.bg-cyan-600\/20]="selectedPreset() === 'corporate'"
            [class.border-cyan-500\/50]="selectedPreset() === 'corporate'"
            [class.text-white]="selectedPreset() === 'corporate'"
            [class.bg-white\/5]="selectedPreset() !== 'corporate'"
            [class.border-white\/10]="selectedPreset() !== 'corporate'"
            [class.text-slate-400]="selectedPreset() !== 'corporate'"
            class="p-2.5 rounded-xl border text-center transition-all hover:bg-white/10 cursor-pointer"
          >
            <i class="fi fi-rr-gem text-violet-400 text-sm mb-1 block"></i>
            <span class="text-xs font-bold block">Sponsors</span>
          </button>
        </div>
      </div>

      <!-- Event Name Input -->
      <div class="space-y-1.5 pt-2 border-t border-white/10">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
          Event Folder / Category Name
        </label>
        <input
          type="text"
          [ngModel]="eventName()"
          (ngModelChange)="eventName.set($event)"
          placeholder="e.g. Cricket Tournament, Football League"
          class="w-full px-4 py-2.5 bg-slate-950/80 border border-white/10 focus:border-cyan-500 rounded-xl text-xs text-white placeholder-slate-500 outline-none transition-colors"
        />
      </div>

      <!-- Sub-channels List -->
      <div class="space-y-2 pt-2 border-t border-white/10">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">
          Sub-channels To Generate
        </label>
        <div class="space-y-2">
          @for (sub of subChannelsList(); track sub.name; let i = $index) {
            <button
              type="button"
              (click)="toggleSubChannel(i)"
              [class.bg-cyan-950\/30]="sub.selected"
              [class.border-cyan-500\/40]="sub.selected"
              [class.bg-white\/5]="!sub.selected"
              [class.border-white\/10]="!sub.selected"
              class="w-full p-3 rounded-2xl border text-left flex items-center justify-between transition-all hover:bg-white/10 cursor-pointer"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-8 h-8 rounded-xl bg-slate-800 border border-white/10 flex items-center justify-center text-cyan-400 text-xs"
                >
                  <i [class]="sub.icon"></i>
                </div>
                <div>
                  <div class="text-xs font-bold text-white">{{ sub.name }}</div>
                  <div class="text-[10px] text-slate-400">{{ sub.description }}</div>
                </div>
              </div>
              <input
                type="checkbox"
                [checked]="sub.selected"
                class="w-4 h-4 accent-cyan-500 rounded cursor-pointer pointer-events-none"
              />
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div
      class="px-6 py-4 border-t border-white/10 bg-slate-950/40 flex items-center justify-end gap-3 shrink-0"
    >
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-xs font-semibold transition-colors cursor-pointer"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="submit()"
        class="px-5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold shadow-lg shadow-cyan-600/20 transition-all cursor-pointer flex items-center gap-2"
      >
        <i class="fi fi-rr-plus"></i>
        <span>Generate Channels</span>
      </button>
    </div>
  </div>
</div>
