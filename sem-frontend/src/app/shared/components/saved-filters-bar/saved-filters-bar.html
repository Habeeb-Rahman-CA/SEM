<!-- ─── SAVED FILTERS BAR ─── -->
<div class="flex items-center gap-2 flex-wrap my-3 text-xs">
  <span class="text-slate-400 font-bold flex items-center gap-1">
    <i class="fi fi-rr-filter text-violet-400"></i> Presets:
  </span>

  @for (preset of filtersService.getPresetsForScope(scope()); track preset.id) {
    <div
      class="inline-flex items-center rounded-xl bg-slate-900 border border-white/10 hover:border-violet-500/50 text-slate-300 text-xs font-semibold overflow-hidden group shadow-sm"
    >
      <button
        type="button"
        (click)="selectPreset(preset)"
        class="px-2.5 py-1 hover:bg-violet-600/20 hover:text-white transition flex items-center gap-1.5 cursor-pointer bg-transparent border-0"
      >
        <i [class]="preset.icon || 'fi fi-rr-filter'" class="text-violet-400"></i>
        <span>{{ preset.name }}</span>
      </button>

      <button
        type="button"
        (click)="deletePreset(preset.id)"
        class="px-1.5 py-1 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition cursor-pointer bg-transparent border-0 border-l border-white/5"
        title="Delete Preset"
      >
        <i class="fi fi-rr-cross text-[10px]"></i>
      </button>
    </div>
  }

  <button
    type="button"
    (click)="openSaveModal()"
    class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold transition flex items-center gap-1 cursor-pointer border border-white/10"
  >
    <i class="fi fi-rr-plus text-xs"></i> Save View
  </button>

  <button
    type="button"
    (click)="shareCurrentFilterLink()"
    class="px-2.5 py-1 rounded-xl bg-violet-600/20 hover:bg-violet-600/30 text-violet-300 hover:text-white font-bold transition flex items-center gap-1 cursor-pointer border border-violet-500/30"
    title="Generate URL containing current filters to share exact view"
  >
    <i class="fi fi-rr-share text-xs"></i> Share View Link
  </button>
</div>

<!-- ─── SAVE FILTER MODAL ─── -->
@if (showSaveModal()) {
  <div
    class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"
  >
    <div
      class="bg-slate-900 border border-white/10 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl"
    >
      <div class="flex items-center justify-between border-b border-white/10 pb-2">
        <h4 class="text-sm font-bold text-white flex items-center gap-1.5">
          <i class="fi fi-rr-bookmark text-violet-400"></i> Save Filter Preset
        </h4>
        <button
          (click)="closeSaveModal()"
          class="text-slate-400 hover:text-white border-0 bg-transparent cursor-pointer"
        >
          <i class="fi fi-rr-cross text-xs"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Preset Name</label>
        <input
          type="text"
          [ngModel]="presetName()"
          (ngModelChange)="presetName.set($event)"
          placeholder="e.g. Senior Forward Squad"
          class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-violet-500"
        />
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
        <button
          (click)="closeSaveModal()"
          class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold cursor-pointer border-0"
        >
          Cancel
        </button>
        <button
          (click)="saveCurrentFilter()"
          [disabled]="!presetName().trim()"
          class="px-4 py-1.5 bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white rounded-xl text-xs font-bold cursor-pointer border-0 shadow-lg"
        >
          Save Preset
        </button>
      </div>
    </div>
  </div>
}
