<!-- ─── SMART DEFAULTS PRE-FILL BANNER ─── -->
<div
  class="p-3 mb-4 rounded-2xl bg-gradient-to-r from-violet-950/60 to-indigo-950/60 border border-violet-500/20 backdrop-blur-md flex items-center justify-between flex-wrap gap-3"
>
  <div class="flex items-center gap-2.5">
    <div
      class="w-7 h-7 rounded-xl bg-violet-500/20 border border-violet-500/30 text-violet-300 flex items-center justify-center text-xs"
    >
      <i class="fi fi-rr-magic-wand"></i>
    </div>
    <div class="text-xs">
      <span class="font-bold text-white">Intelligent Defaults:</span>
      <span class="text-slate-300 ml-1">
        Pre-filled using your previous selections (Venue:
        <span class="text-violet-300 font-semibold">{{
          prefsService.preferences().defaultVenueName
        }}</span
        >, Sport:
        <span class="text-violet-300 font-semibold">{{
          prefsService.preferences().defaultCategory
        }}</span
        >)
      </span>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="onTriggerPrefill()"
      class="px-2.5 py-1 rounded-xl bg-violet-600/30 hover:bg-violet-600/50 text-violet-200 border border-violet-500/40 text-[11px] font-bold transition flex items-center gap-1 cursor-pointer"
    >
      <i class="fi fi-rr-bolt text-xs"></i> Re-apply Defaults
    </button>
    <button
      type="button"
      (click)="openSettings()"
      class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold border border-white/10 transition cursor-pointer"
    >
      <i class="fi fi-rr-settings text-xs"></i> Edit Defaults
    </button>
  </div>
</div>

<!-- ─── EDIT SMART DEFAULTS MODAL ─── -->
@if (showSettingsModal()) {
  <div
    class="fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="bg-slate-900 border border-white/10 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden p-6 space-y-5 animate-in zoom-in-95 duration-200"
    >
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <div class="flex items-center gap-2">
          <i class="fi fi-rr-magic-wand text-violet-400"></i>
          <h3 class="text-base font-extrabold text-white">Smart Preference Defaults</h3>
        </div>
        <button
          type="button"
          (click)="closeSettings()"
          class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center cursor-pointer border-0"
        >
          <i class="fi fi-rr-cross text-xs"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-300 mb-1">Default Venue</label>
          <input
            type="text"
            [ngModel]="venueName()"
            (ngModelChange)="venueName.set($event)"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-violet-500"
          />
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">Default Sport / Category</label>
          <input
            type="text"
            [ngModel]="category()"
            (ngModelChange)="category.set($event)"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-violet-500"
          />
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">Default Match Duration (Mins)</label>
          <input
            type="number"
            [ngModel]="matchDuration()"
            (ngModelChange)="matchDuration.set($event)"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-violet-500"
          />
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">Default Organizer Name</label>
          <input
            type="text"
            [ngModel]="organizerName()"
            (ngModelChange)="organizerName.set($event)"
            class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white outline-none focus:border-violet-500"
          />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-white/10">
        <button
          type="button"
          (click)="closeSettings()"
          class="px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-bold cursor-pointer border-0"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="saveSettings()"
          class="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-xl text-xs font-bold cursor-pointer border-0 shadow-lg"
        >
          Save Smart Defaults
        </button>
      </div>
    </div>
  </div>
}
