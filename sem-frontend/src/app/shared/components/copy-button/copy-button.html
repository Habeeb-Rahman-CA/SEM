<button
  #btn
  type="button"
  (click)="copyToClipboard($event)"
  class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-violet-500/40 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition cursor-pointer shrink-0"
  [title]="isCopied() ? 'Copied!' : 'Click to Copy'"
>
  @if (isCopied()) {
    <i class="fi fi-rr-check text-emerald-400 text-xs animate-fadeIn"></i>
    <span class="text-[11px] font-bold text-emerald-400">Copied</span>
  } @else {
    <i class="fi fi-rr-copy text-violet-400 text-xs"></i>
    @if (label()) {
      <span class="truncate">{{ label() }}</span>
    }
  }
</button>
