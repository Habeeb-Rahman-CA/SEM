# ─────────────────────────────────────────────────────────────────────────────
# Production TLS variant. Mount into the container at:
#   /etc/nginx/conf.d/default.conf
# and provide certificates at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
#
# HTTP/2 is enabled over TLS; HTTP/3 (QUIC) can be turned on by uncommenting
# the `listen 443 quic reuseport;` block below if the nginx build supports it
# (nginx ≥ 1.25 with `--with-http_v3_module`).
# ─────────────────────────────────────────────────────────────────────────────

upstream sem_backend {
    server sem-backend:3001;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# Compression identical to the HTTP config
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/wasm
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

# brotli on;
# brotli_comp_level 5;
# brotli_static on;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge (Let's Encrypt) — leave open
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS / HTTP/2 ───────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    # HTTP/3 (QUIC) — uncomment on nginx 1.25+ builds with quic module
    # listen 443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS profile — TLSv1.2 + TLSv1.3, HTTP/2 ALPN
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security headers ─────────────────────────────────────────────────
    # HSTS — 1 year, include subdomains, allow preload list submission.
    # Requires: served exclusively over HTTPS across every subdomain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Immutable hashed assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://sem_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /webhooks/ {
        proxy_pass http://sem_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location /socket.io {
        proxy_pass http://sem_backend/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
